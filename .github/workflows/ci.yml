name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Jamais sur main : une fusion suivante couperait `deployer` en plein envoi.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verifier:
    name: Types, lint, garde, tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: usine_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/usine_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Garde (aucune suppression, aucun secret)
        run: pnpm garde
      - name: Tests
        run: pnpm test
      - name: Build (sans base joignable)
        run: pnpm build
        env:
          DATABASE_URL: ""

  image:
    name: Image Docker
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: court
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # Sur une PR : l'image se construit seulement ; sur main : elle est poussée.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/will383842/usine-axion-ia:latest
            ghcr.io/will383842/usine-axion-ia:sha-${{ steps.court.outputs.sha }}
          build-args: |
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deployer:
    name: Envoi au serveur
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Un seul envoi à la fois vers le serveur, jamais interrompu.
    concurrency:
      group: deploiement-usine
      cancel-in-progress: false
    # Secrets rangés dans l'environnement `usine-production`, réservé à la branche main : une autre branche ne les lit pas.
    environment: usine-production
    permissions:
      contents: read
      packages: read
    steps:
      # Aucune action tierce dans ce job : seul le code ci-dessous voit la clé.
      - name: Envoyer l'image au serveur et relancer l'Usine
        env:
          CLE: ${{ secrets.USINE_DEPLOY_SSH_KEY }}
          EMPREINTE: ${{ secrets.USINE_DEPLOY_KNOWN_HOSTS }}
          HOTE: ${{ vars.USINE_DEPLOY_HOST }}
          COMPTE: ${{ vars.USINE_DEPLOY_USER }}
          JETON_REGISTRE: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Sans clé, empreinte, hôte et compte : rien n'est envoyé (jamais d'empreinte acceptée au premier contact).
          if [ -z "$CLE" ] || [ -z "$EMPREINTE" ] || [ -z "$HOTE" ] || [ -z "$COMPTE" ]; then
            echo "::warning::Déploiement non réglé (clé, empreinte, hôte ou compte absent) : rien n'est envoyé."; exit 0
          fi
          if [ "$COMPTE" = "root" ]; then echo "::error::Le compte de déploiement ne peut pas être root."; exit 1; fi
          dossier="$(mktemp -d)"
          trap 'rm -rf "$dossier"; docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          ( umask 077; printf '%s\n' "$CLE" > "$dossier/cle"; printf '%s\n' "$EMPREINTE" > "$dossier/known_hosts" )
          court="${GITHUB_SHA::7}"
          printf '%s' "$JETON_REGISTRE" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "ghcr.io/will383842/usine-axion-ia:sha-$court"
          docker tag "ghcr.io/will383842/usine-axion-ia:sha-$court" "usine-axion-ia:ci-$GITHUB_SHA"
          # La commande envoyée est ignorée par le serveur : la clé n'a droit qu'à sa commande forcée.
          docker save "usine-axion-ia:ci-$GITHUB_SHA" | gzip | ssh -i "$dossier/cle" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dossier/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            -- "$COMPTE@$HOTE" recevoir
