# ESSAI D'UN MODELE DE CODE TIERS (Kimi ou DeepSeek) : fait coder UNE fiche par Claude Code sans interface, puis livre un correctif VALIDE en artefact.
# Porte depuis le workflow du Studio public. Declenchement manuel seulement, depuis la branche main.
# NE JAMAIS FUSIONNER SANS RELECTURE OPUS. Secrets requis : KIMI_API_KEY et/ou DEEPSEEK_API_KEY. Aucun secret Anthropic.
# Le job 1 (coder) est NON FIABLE PAR CONCEPTION : le modele tiers peut y executer du code et y lire sa propre cle.
# Un PLAFOND DE DEPENSE BAS est donc obligatoire sur le compte du fournisseur. Le job 1 n'a aucun droit d'ecriture ;
# le job 2 (verifier-correctif), sur une machine neuve et en lecture seule, verifie tout puis envoie le correctif valide
# en artefact. Aucune ecriture depuis ce workflow : le pilote cree la branche et la PR (voir le resume du run).
# DEPOT PUBLIC : la fiche est lue dans $GITHUB_EVENT_PATH, jamais via `env:`, elle n'est pas recopiee dans le resume,
# et aucune reponse du modele n'est journalisee. Ne JAMAIS activer le mode debug sur ce workflow.
name: essai-modele-tiers

on:
  workflow_dispatch:
    inputs:
      fiche:
        description: "Texte de la consigne (la fiche a coder)"
        required: true
        type: string
      fournisseur:
        description: "Fournisseur du modele"
        required: true
        type: choice
        options: [deepseek, kimi]
        default: deepseek
      modele:
        description: "Nom du modele (vide = defaut du fournisseur : deepseek-flash / kimi-k3[1m] ; tache difficile : deepseek-v4-pro)"
        required: false
        type: string
        default: ""
      nom:
        description: "Identifiant court de la fiche (minuscules, chiffres, tirets), sert a nommer la branche"
        required: true
        type: string
      base:
        description: "Branche de depart (vide = branche par defaut). Pour corriger une PR ouverte : le nom de sa branche."
        required: false
        type: string
        default: ""

      max_tours:
        description: "Plafond d'allers-retours du modele (1 a 150, defaut 80)"
        required: false
        type: string
        default: "80"

permissions: {}

concurrency:
  group: essai-modele-tiers-${{ inputs.fournisseur }}-${{ inputs.nom }}
  cancel-in-progress: false

jobs:
  coder:
    name: coder (non fiable)
    # Proprietaire du depot, depuis main seulement (la branche de depart, elle, peut etre une PR : entree base).
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
    permissions:
      contents: read
    steps:
      - name: Valider les entrees et le secret du fournisseur
        id: valider
        env:
          FOURNISSEUR: ${{ inputs.fournisseur }}
          NOM: ${{ inputs.nom }}
          MODELE_SAISI: ${{ inputs.modele }}
          MAX_TOURS: ${{ inputs.max_tours }}
          # Booleens seulement : la valeur des secrets n'est exposee qu'a l'etape du modele.
          KIMI_PRESENT: ${{ secrets.KIMI_API_KEY != '' }}
          DEEPSEEK_PRESENT: ${{ secrets.DEEPSEEK_API_KEY != '' }}
        run: |
          if ! [[ "$NOM" =~ ^[a-z0-9][a-z0-9-]{0,39}$ ]]; then
            echo "::error::Entree nom invalide : 1 a 40 caracteres, minuscules, chiffres et tirets."; exit 1
          fi
          if [ -n "$MODELE_SAISI" ] && ! [[ "$MODELE_SAISI" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,63}(\[[0-9a-z]{1,8}\])?$ ]]; then
            echo "::error::Entree modele invalide."; exit 1
          fi
          if ! [[ "$MAX_TOURS" =~ ^[0-9]{1,3}$ ]] || [ "$((10#$MAX_TOURS))" -lt 1 ] || [ "$((10#$MAX_TOURS))" -gt 150 ]; then
            echo "::error::Entree max_tours invalide : entier de 1 a 150."; exit 1
          fi
          case "$FOURNISSEUR" in
            kimi)     [ "$KIMI_PRESENT" = "true" ]     || { echo "::error::Le secret KIMI_API_KEY est vide ou absent : ajoute-le dans les secrets du depot."; exit 1; } ;;
            deepseek) [ "$DEEPSEEK_PRESENT" = "true" ] || { echo "::error::Le secret DEEPSEEK_API_KEY est vide ou absent : ajoute-le dans les secrets du depot."; exit 1; } ;;
            *) echo "::error::Fournisseur inconnu : $FOURNISSEUR"; exit 1 ;;
          esac

      - name: Resoudre la branche de depart en un commit fixe
        id: base
        env:
          BASE: ${{ inputs.base }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$BASE" ]; then printf 'sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! [[ "$BASE" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ ]] || [[ "$BASE" == *..* || "$BASE" == */ || "$BASE" == *.lock || "$BASE" == *//* ]]; then
            echo "::error::Entree base invalide : nom de branche attendu."; exit 1
          fi
          SHA=$(gh api "repos/${{ github.repository }}/git/ref/heads/$BASE" --jq .object.sha 2>/dev/null) || { echo "::error::Branche de depart introuvable."; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Commit de depart invalide."; exit 1; }
          # Une base non relue ne doit pas faire executer son code avant le modele (install, typegen, prisma, composer).
          if [ "$SHA" != "$GITHUB_SHA" ]; then
            gh api "repos/${{ github.repository }}/compare/$GITHUB_SHA...$SHA" --jq '.files[].filename' > "$RUNNER_TEMP/base-fichiers.txt" 2>/dev/null || { echo "::error::Comparaison de la base impossible."; exit 1; }
            [ "$(wc -l < "$RUNNER_TEMP/base-fichiers.txt")" -lt 300 ] || { echo "::error::Base trop eloignee (300 fichiers ou plus) : refus."; exit 1; }
            if grep -Eiq '(^|/)(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.npmrc|\.pnpmfile\.c?js|composer\.(json|lock)|(next|prisma|postcss|tailwind)\.config\.[^/]*)$|(^|/)prisma/|^src/lib/redirections/|^src/lib/i18n/|^src/i18n/|^src/content/preuves-sociales' "$RUNNER_TEMP/base-fichiers.txt"; then
              echo "::error::La base modifie des fichiers executes a l'installation (dependances, next/prisma config, schema) : refus. Corriger cette PR avec Claude."; exit 1
            fi
          fi
          printf 'sha=%s\n' "$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          ref: ${{ steps.base.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ${{ runner.tool_cache }}/setup-pnpm

      - name: Installer les dependances du depot
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec next typegen || echo "::warning::next typegen a echoue : tsc peut signaler des erreurs hors fiche."

      # Version figee de Claude Code (derniere stable verifiee le 2026-11-28).
      - name: Installer Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.332

      - name: Choisir le modele et ecrire les reglages (hors depot)
        env:
          FOURNISSEUR: ${{ inputs.fournisseur }}
          MODELE_SAISI: ${{ inputs.modele }}
        run: |
          if [ -n "$MODELE_SAISI" ]; then MODELE="$MODELE_SAISI"
          elif [ "$FOURNISSEUR" = "kimi" ]; then MODELE='kimi-k3[1m]'
          else MODELE='deepseek-flash'; fi
          printf 'MODELE=%s\n' "$MODELE" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/reglages-essai.json" <<'JSON'
          {
            "permissions": {
              "deny": [
                "Read(./.env*)",
                "Read(**/.env*)",
                "Read(**/*secret*)",
                "Read(**/*.pem)",
                "Read(**/*.key)",
                "Read(./.git/**)",
                "Edit(./.git/**)",
                "Write(./.git/**)",
                "Bash(curl:*)",
                "Bash(wget:*)"
              ]
            }
          }
          JSON

      - name: Isoler le modele (utilisateur sans sudo)
        run: |
          sudo useradd -m -s /bin/bash essai
          # /home/runner est en 750 : l'utilisateur isole ne peut pas traverser jusqu'a l'espace de travail. Le modele
          # travaille donc sur une COPIE dans /srv/essai ; l'espace de travail du runner (et son .git) reste hors de sa portee.
          sudo install -d -o essai -g essai -m 700 /srv/essai
          sudo cp -a "$GITHUB_WORKSPACE/." /srv/essai/ && sudo chown -R essai: /srv/essai
          sudo install -m 644 "$RUNNER_TEMP/reglages-essai.json" /srv/reglages-essai.json
          # Repertoire neutre : runner ne peut pas entrer dans /srv/essai (700) et essai ne peut pas lire /home/runner.
          cd /
          sudo -u essai -H git config --global --add safe.directory /srv/essai
          # Auto-controle avant le modele : l'utilisateur isole ne doit ni ecrire dans les fichiers de commandes du runner
          # (GITHUB_ENV, GITHUB_PATH...) ni obtenir sudo. Sinon on echoue sans lancer le modele.
          for f in "$GITHUB_ENV" "$GITHUB_PATH" "$GITHUB_OUTPUT" "$GITHUB_STATE" "$GITHUB_STEP_SUMMARY"; do
            if [ -n "$f" ] && sudo -u essai test -w "$f"; then
              echo "::error::Isolement insuffisant : l'utilisateur essai peut ecrire dans un fichier de commandes du runner."; exit 1
            fi
          done
          if sudo -u essai sudo -n true 2>/dev/null; then
            echo "::error::Isolement insuffisant : l'utilisateur essai peut utiliser sudo."; exit 1
          fi
          # L'utilisateur isole doit pouvoir lancer pnpm et claude depuis la copie (outils lisibles hors de /home/runner).
          sudo -u essai -H env "PATH=$PATH" sh -c 'cd /srv/essai && pnpm --version && claude --version && pnpm exec vitest --version' >/dev/null || { echo "::error::essai ne peut pas lancer pnpm, claude ou vitest."; exit 1; }

      - name: Lancer Claude Code (modele tiers)
        env:
          NOM: ${{ inputs.nom }}
          MAX_TOURS: ${{ inputs.max_tours }}
          ANTHROPIC_BASE_URL: ${{ inputs.fournisseur == 'kimi' && 'https://api.moonshot.ai/anthropic' || 'https://api.deepseek.com/anthropic' }}
          ANTHROPIC_AUTH_TOKEN: ${{ inputs.fournisseur == 'kimi' && secrets.KIMI_API_KEY || inputs.fournisseur == 'deepseek' && secrets.DEEPSEEK_API_KEY || '' }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          CLAUDE_CODE_ATTRIBUTION_HEADER: "0"
        run: |
          unset ANTHROPIC_API_KEY CLAUDE_CODE_OAUTH_TOKEN
          # Toutes les variables de modele = le modele choisi (sinon echecs silencieux, voir la doc du fournisseur).
          export ANTHROPIC_MODEL="$MODELE"
          export ANTHROPIC_DEFAULT_OPUS_MODEL="$MODELE"
          export ANTHROPIC_DEFAULT_SONNET_MODEL="$MODELE"
          export CLAUDE_CODE_SUBAGENT_MODEL="$MODELE"
          export ANTHROPIC_SMALL_FAST_MODEL="$MODELE"
          mkdir -p "$RUNNER_TEMP/essai"
          # Le modele travaille dans la copie /srv/essai (cd fait par essai) ; la sortie JSON est ecrite par ce shell (runner) en chemin absolu.
          cd /
          # La fiche vient du fichier d'evenement du runner (depot public : jamais par env:, jamais affichee).
          FICHE="$(jq -r '.inputs.fiche // empty' "$GITHUB_EVENT_PATH")"
          [ -n "$FICHE" ] || { echo "::error::Fiche vide."; exit 1; }
          RAPPEL="CONSIGNES FIXES : travaille sur la fiche ci-dessous seulement. Ne touche jamais a .github/, aux Dockerfile*, a deploiement/, a scripts/, aux migrations, a pilotage/ et docs/, aux fichiers d'authentification et de session, aux passerelles sortantes (src/passerelles/), aux gardes et leurs tests, ni aux fichiers de secrets ou d'environnement. N'ajoute aucun appel reseau. Ne modifie ni package.json ni le fichier de verrouillage. Lance les tests cibles existants qui concernent ta fiche, s'il y en a (par exemple pnpm exec vitest run <fichier de test> ; aucune base de donnees n'est disponible ici). Verifie aussi les types et le style : pnpm exec tsc --noEmit (ignore les erreurs des fichiers que tu n'as pas modifies), puis pnpm exec eslint <fichiers modifies>. SEULES commandes autorisees : celles-ci, git status et git diff, plus la lecture seule (ls, cat, head, tail, wc, grep, git log, git show). Lance-les telles quelles depuis le dossier courant : sans cd, sans git -C, sans tube (|), sans redirection (2>&1, >) ; toute autre forme est refusee, n'insiste pas. Pas de commit : laisse les modifications dans l'arbre de travail. Si tu ne termines pas tout, laisse quand meme tes modifications partielles dans les fichiers et decris ce qui reste dans RESTE.md a la racine."
          set +e
          sudo -u essai -H --preserve-env=ANTHROPIC_BASE_URL,ANTHROPIC_AUTH_TOKEN,ANTHROPIC_MODEL,ANTHROPIC_DEFAULT_OPUS_MODEL,ANTHROPIC_DEFAULT_SONNET_MODEL,ANTHROPIC_SMALL_FAST_MODEL,CLAUDE_CODE_SUBAGENT_MODEL,CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC,CLAUDE_CODE_ATTRIBUTION_HEADER env "PATH=$PATH" sh -c 'cd /srv/essai && exec "$@"' sh claude -p "$RAPPEL

          FICHE :
          $FICHE" \
            --output-format json \
            --max-turns "$((10#$MAX_TOURS))" \
            --settings /srv/reglages-essai.json \
            --permission-mode acceptEdits \
            --setting-sources user --strict-mcp-config \
            --allowedTools "Read" "Edit" "Write" "Glob" "Grep" "Bash(pnpm exec vitest run:*)" "Bash(git status)" "Bash(git status:*)" "Bash(ls:*)" "Bash(cat:*)" "Bash(head:*)" "Bash(tail:*)" "Bash(wc:*)" "Bash(grep:*)" "Bash(git log:*)" "Bash(git show:*)" "Bash(git diff:*)" "Bash(pnpm exec tsc --noEmit:*)" "Bash(pnpm exec eslint:*)" \
            --disallowedTools "WebFetch" "WebSearch" "Bash(node:*)" "Bash(npm:*)" "Bash(npx:*)" "Bash(git commit:*)" "Bash(git config:*)" \
            > "$RUNNER_TEMP/essai/essai-$NOM.json" 2> "$RUNNER_TEMP/essai/essai-$NOM.err"
          CODE=$?
          set -e
          # La sortie d erreur du modele n est pas affichee : les journaux de ce depot sont publics.
          [ "$CODE" -eq 0 ] || { echo "::error::claude s'est termine avec le code $CODE"; exit 1; }

      # Nettoyage TOUJOURS execute, avant tout upload : tue tout processus restant du modele (deux passes), puis reprend la
      # propriete de l'espace de travail. Separe de l'etape du modele pour ne pas dependre de sa fin.
      - name: Nettoyer apres le modele (toujours)
        if: always()
        run: |
          sudo pkill -KILL -u essai || true
          sleep 1
          sudo pkill -KILL -u essai || true
          sudo chown -R runner: "$GITHUB_WORKSPACE"

      - name: Produire le correctif
        env:
          NOM: ${{ inputs.nom }}
        run: |
          # Reprise des fichiers de la copie du modele (processus deja tues par l'etape de nettoyage). .git et les dependances
          # installees et non suivies (node_modules) ne sont ni ecrases ni effaces. Liens, peripheriques et tubes
          # ne sont pas suivis comme fichiers speciaux ; un lien symbolique est refuse plus bas.
          # Fermeture de la course : plus aucun processus ni tache de l'utilisateur isole ne peut toucher la copie pendant la reprise.
          sudo crontab -r -u essai 2>/dev/null || true
          sudo usermod -L essai
          sudo pkill -KILL -u essai || true
          sudo chown root:root /srv/essai
          sudo chmod 700 /srv/essai
          sudo rsync -a --delete --no-owner --no-group --no-devices --no-specials --exclude=/.git --exclude=node_modules /srv/essai/ "$GITHUB_WORKSPACE/"
          sudo chown -R runner: "$GITHUB_WORKSPACE"
          git -c core.fsmonitor=false -c core.hooksPath=/dev/null add -A
          if git -c core.fsmonitor=false -c core.hooksPath=/dev/null diff --cached --no-renames --raw | awk '$1 ~ /^:(120000|160000)$/ || $2 ~ /^(120000|160000)$/ {f=1} END{exit !f}'; then
            echo "::error::Lien symbolique ou sous-module dans le correctif du modele."; exit 1
          fi
          # RESTE.md (travail partiel du modele) : copie a part dans l'artefact, jamais dans le correctif.
          if [ -f RESTE.md ] && [ ! -L RESTE.md ]; then cp -- RESTE.md "$RUNNER_TEMP/essai/RESTE-$NOM.md"; fi
          if ! git cat-file -e HEAD:RESTE.md 2>/dev/null; then git rm --cached -q --ignore-unmatch -- RESTE.md; fi
          git -c core.fsmonitor=false -c core.hooksPath=/dev/null diff --cached --binary --full-index --no-renames HEAD > "$RUNNER_TEMP/essai/essai-$NOM.patch"

      # Avant tout envoi : la valeur EXACTE de la cle du fournisseur ne doit figurer dans aucun fichier envoye (audit du 28/11).
      # La cle passe par env: seulement, n'est jamais affichee ; si elle est trouvee (ou si le controle est impossible), rien n'est envoye.
      - name: Controler l'absence de la cle dans les fichiers a envoyer
        id: cle
        if: always() && steps.valider.outcome == 'success'
        env:
          CLE: ${{ inputs.fournisseur == 'kimi' && secrets.KIMI_API_KEY || inputs.fournisseur == 'deepseek' && secrets.DEEPSEEK_API_KEY || '' }}
        run: |
          [ -d "$RUNNER_TEMP/essai" ] || { echo "Rien a envoyer."; exit 0; }
          [ -n "$CLE" ] || { echo "::error::Cle du fournisseur absente : controle impossible, rien n'est envoye."; exit 1; }
          RC=0
          grep -rqF -- "$CLE" "$RUNNER_TEMP/essai" || RC=$?
          if [ "$RC" -ne 1 ]; then
            echo "::error::La cle du fournisseur figure dans un fichier a envoyer (ou le controle a echoue) : rien n'est envoye."; exit 1
          fi

      - name: Sauver le correctif et la sortie JSON en artefact
        if: always() && steps.valider.outcome == 'success' && steps.cle.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: essai-${{ inputs.fournisseur }}-${{ inputs.nom }}
          path: |
            ${{ runner.temp }}/essai/essai-${{ inputs.nom }}.json
            ${{ runner.temp }}/essai/essai-${{ inputs.nom }}.patch
            ${{ runner.temp }}/essai/RESTE-${{ inputs.nom }}.md
          if-no-files-found: warn
          retention-days: 1

  verifier-correctif:
    name: verifier le correctif (confiance, lecture seule)
    needs: coder
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Valider les entrees
        env:
          FOURNISSEUR: ${{ inputs.fournisseur }}
          NOM: ${{ inputs.nom }}
          MODELE_SAISI: ${{ inputs.modele }}
        run: |
          [[ "$NOM" =~ ^[a-z0-9][a-z0-9-]{0,39}$ ]] || { echo "::error::Entree nom invalide."; exit 1; }
          if [ -n "$MODELE_SAISI" ] && ! [[ "$MODELE_SAISI" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,63}(\[[0-9a-z]{1,8}\])?$ ]]; then
            echo "::error::Entree modele invalide."; exit 1
          fi
          case "$FOURNISSEUR" in kimi|deepseek) ;; *) echo "::error::Fournisseur inconnu."; exit 1 ;; esac
          if [ -n "$MODELE_SAISI" ]; then MODELE="$MODELE_SAISI"
          elif [ "$FOURNISSEUR" = "kimi" ]; then MODELE='kimi-k3[1m]'
          else MODELE='deepseek-flash'; fi
          printf 'MODELE=%s\n' "$MODELE" >> "$GITHUB_ENV"

      - name: Verifier le commit de depart
        env:
          BASE_SHA: ${{ needs.coder.outputs.base_sha }}
        run: '[[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Commit de depart absent ou invalide."; exit 1; }'

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          ref: ${{ needs.coder.outputs.base_sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: essai-${{ inputs.fournisseur }}-${{ inputs.nom }}
          path: ${{ runner.temp }}/essai

      - name: Verifier le modele reellement utilise
        env:
          NOM: ${{ inputs.nom }}
        run: |
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/essai/essai-" + process.env.NOM + ".json", "utf8"));
            const s = Array.isArray(j) ? (j.find(x => x.type === "result") || {}) : j;
            if (s.is_error || s.subtype !== "success") { console.error("::error::Sortie en erreur ou non terminee (subtype=" + String(s.subtype).replace(/[^a-z_]/g, "").slice(0, 20) + ")."); process.exit(1); }
            const noms = Object.keys(s.modelUsage || {});
            const sur = x => /^[A-Za-z0-9._:\/\[\]-]{1,40}$/.test(x) && !/^sk-/i.test(x);
            console.log("Modeles utilises : " + JSON.stringify(noms.filter(sur)));
            if (noms.length === 0) { console.error("::error::modelUsage vide : modele reel non verifiable."); process.exit(1); }
            const claude = noms.filter(n => /claude|anthropic/i.test(n));
            if (claude.length) { console.error("::error::Repli silencieux sur un modele Claude : " + claude.filter(sur).join(", ")); process.exit(1); }
            const norme = x => x.replace(/\[[^\]]*\]$/, "").toLowerCase();
            if (!noms.some(n => norme(n) === norme(process.env.MODELE))) { console.error("::error::Modele attendu absent (" + process.env.MODELE + ") parmi " + noms.filter(sur).join(", ")); process.exit(1); }
          '

      - name: Appliquer le correctif
        env:
          NOM: ${{ inputs.nom }}
        run: git apply --index --binary "$RUNNER_TEMP/essai/essai-$NOM.patch"

      - name: Garde des chemins interdits
        run: |
          if git diff --cached --no-renames --raw | awk '$1 ~ /^:(120000|160000)$/ || $2 ~ /^(120000|160000)$/ {f=1} END{exit !f}'; then
            echo "::error::Lien symbolique ou sous-module dans le correctif."; exit 1
          fi
          # Aucun changement de mode (dont le passage en executable) et aucun nouveau fichier executable.
          if git diff --cached --no-renames --raw | awk '($1 != ":000000" && $2 != "000000" && substr($1,2) != $2) || ($1 == ":000000" && $2 == "100755") {f=1} END{exit !f}'; then
            echo "::error::Changement de mode ou fichier executable dans le correctif."; exit 1
          fi
          git -c core.quotePath=false diff --cached --no-renames --name-only > "$RUNNER_TEMP/touches.txt"
          if [ ! -s "$RUNNER_TEMP/touches.txt" ]; then echo "::error::Diff vide : rien n'a ete code."; exit 1; fi
          if grep -q '^"' "$RUNNER_TEMP/touches.txt"; then echo "::error::Nom de fichier entre guillemets (caracteres speciaux)."; exit 1; fi
          # Aucun nom de fichier n'est affiche avant d'avoir verifie qu'il ne contient que des caracteres sobres (journal public).
          if grep -Evq '^[][A-Za-z0-9._/@()+-]{1,200}$' "$RUNNER_TEMP/touches.txt"; then
            echo "::error::Nom de fichier a caracteres non autorises ou trop long (liste non affichee)."; exit 1
          fi
          echo "Fichiers touches :"; cat "$RUNNER_TEMP/touches.txt"
          # Chemins interdits (insensible a la casse), a tout niveau : .git* (dont .github), Dockerfile*, docker-compose*, .dockerignore,
          # .env*, .npmrc, .mcp.json, .claude/, .husky/, .vscode/, .devcontainer/, .pnpmfile, AGENTS.md, CLAUDE.md, package.json,
          # lockfiles, tsconfig*.json, *.config.*, secrets et cles. A la racine : scripts/ (la garde de la CI, la regle sortante,
          # les scripts de sauvegarde et de publication), deploiement/, pilotage/, docs/, migrations/, bases.source.json ; dans src/ :
          # passerelles/ (seul endroit autorise a parler au reseau), authentification, session, mot de passe, connexion, second code,
          # porte, reglages, opposition, proxy, instrumentation, lexique, migrations, demarrage, bases ; dans tests/ : les essais
          # des gardes, du deploiement, des bases et des fixtures de bases.
          INTERDIT='(^|/)\.prettierrc[^/]*$|(^|/)package\.ya?ml$|(^|/)node_modules/|(^|/)prettier\.config\.[^/]*$|(^|/)\.prettierignore$|(^|/)\.editorconfig$|(^|/)\.git[^/]*|(^|/)\.dockerignore$|(^|/)(Dockerfile|docker-compose)[^/]*$|(^|/)\.env|(^|/)\.npmrc$|(^|/)\.mcp\.json$|(^|/)\.claude/|(^|/)\.husky/|(^|/)\.vscode/|(^|/)\.devcontainer/|(^|/)\.pnpmfile\.c?js$|(^|/)(AGENTS|CLAUDE)\.md$|(^|/)package\.json$|(^|/)(pnpm-lock\.yaml|package-lock\.json|yarn\.lock|npm-shrinkwrap\.json|bun\.lockb?|pnpm-workspace\.yaml)$|(^|/)tsconfig[^/]*\.json$|(^|/)[^/]*\.config\.[^/]*$|^(scripts/|deploiement/|pilotage/|docs/|migrations/|bases\.source\.json$|src/passerelles/|src/auth/|src/porte/|src/reglages/|src/opposition/|src/proxy\.ts$|src/instrumentation\.ts$|src/app/api/|src/app/connexion/|src/app/reglages/|src/lib/(lexique|migrations|demarrage|jeton-session|mot-de-passe|plages-cloudflare|suite-sure|bases-copie|empreinte-bases)\.ts$|tests/(garde|deploiement/|demarrage|migrations|fixtures-bases/|porte|second-code|connexion|suite-sure|bases-|commandes-protection))|authent|auth\.|(^|/)auth/|session|secret|credential|\.pem$|\.key$|^tests/actions-serveur-gardees\.test\.ts$|^tests/contrat/|^tests/fixtures/porte-v2/|^src/contrats/porte\.ts$|^tests/arret\.test\.ts$|^src/arret/|^tests/opposition\.test\.ts$|^tests/sauvegarde\.test\.ts$|^tests/interrupteurs-[^/]*\.test\.ts$|^src/commandes/protection\.ts$|^src/(agregats|tirage)/signature\.ts$|^src/lib/base\.ts$|^src/donnees/schema\.ts$'
          if grep -Eiq "$INTERDIT" "$RUNNER_TEMP/touches.txt"; then
            echo "::error::Fichier(s) interdit(s) touche(s) :"; grep -Ei "$INTERDIT" "$RUNNER_TEMP/touches.txt"; exit 1
          fi

      # Mise en forme automatique, dans le job de CONFIANCE seulement (apres la garde des chemins interdits, avant l'artefact).
      # 1) fins de ligne LF sur les fichiers texte modifies ; 2) Prettier SEULEMENT sur ces fichiers.
      # Le correctif n'apporte AUCUNE configuration ni aucun code a Prettier : versions exactes de prettier, de ses plugins et de
      # tailwindcss lues dans le fichier de verrouillage de la BASE (HEAD = commit de depart), pas dans les plages du package.json ;
      # configuration extraite de la BASE (git show) vers un dossier temporaire neuf, passee par --config (ce qui coupe toute
      # recherche de configuration depuis les fichiers du correctif : package.json, package.yaml, .prettierrc*, prettier.config.*),
      # avec --no-editorconfig et --ignore-path (copie de la .prettierignore de la base, sinon /dev/null). Les plugins ne sont
      # resolus que depuis ce dossier d'installation temporaire : apres controle des noms nus, ils sont reecrits en CHEMINS ABSOLUS
      # resolus dans ce dossier, et Prettier est lance avec ce dossier comme repertoire courant (jamais depuis le correctif : sinon un
      # fichier du correctif nomme comme le plugin serait importe et execute). Un plugin relatif ou une feuille Tailwind locale est refuse.
      # Si une version est introuvable, le formatage est saute avec un avertissement, sans faire echouer le job.
      # Aucune sortie de Prettier ni de npm n'est affichee (depot public : jamais de code du modele dans le journal).
      # Une erreur de Prettier ne fait pas echouer le job : le correctif reste tel quel, avec un avertissement.
      # 3) le correctif de l'artefact est RECALCULE apres la mise en forme, sans RESTE.md (jamais dans le correctif valide).
      - name: Mise en forme automatique (LF + Prettier de la base) et recalcul du correctif
        env:
          NOM: ${{ inputs.nom }}
        run: |
          PATCH="$RUNNER_TEMP/essai/essai-$NOM.patch"
          RESUME="Mise en forme automatique :"
          git -c core.quotePath=false diff --cached --no-renames --diff-filter=AM --name-only | grep -E '\.(ts|tsx|js|mjs|cjs|json|md|css|yml|yaml|php|py|sql|txt)$' > "$RUNNER_TEMP/forme-candidats.txt" || true
          : > "$RUNNER_TEMP/forme-texte.txt"
          while IFS= read -r f; do
            # Fichier ordinaire et texte seulement (jamais un binaire, jamais un lien).
            if [ -f "$f" ] && [ ! -L "$f" ] && grep -Iq -- '' "$f"; then printf '%s\n' "$f" >> "$RUNNER_TEMP/forme-texte.txt"; fi
          done < "$RUNNER_TEMP/forme-candidats.txt"
          NB_CR=0
          while IFS= read -r f; do
            if grep -q -- $'\r' "$f"; then sed -i -- 's/\r$//' "$f" && NB_CR=$((NB_CR + 1)); fi
          done < "$RUNNER_TEMP/forme-texte.txt"
          RESUME="$RESUME LF normalise sur $NB_CR fichier(s)."
          # Prettier : seulement si la BASE le declare (racine ou frontend/), jamais depuis le correctif.
          NB_PRET=0
          for DIR in . frontend; do
            if [ "$DIR" = "." ]; then PFX=""; SEL='^'; else PFX="$DIR/"; SEL="^$DIR/"; fi
            git show "HEAD:${PFX}package.json" > "$RUNNER_TEMP/base-pkg.json" 2>/dev/null || continue
            grep -E "${SEL}.*\.(ts|tsx|js|mjs|cjs|json|md|css|yml|yaml)$" "$RUNNER_TEMP/forme-texte.txt" > "$RUNNER_TEMP/prettier-fichiers.txt" || true
            [ -s "$RUNNER_TEMP/prettier-fichiers.txt" ] || continue
            # Versions exactes : fichier de verrouillage de la BASE.
            if git show "HEAD:${PFX}pnpm-lock.yaml" > "$RUNNER_TEMP/base-lock.txt" 2>/dev/null; then KIND=pnpm
            elif git show "HEAD:${PFX}package-lock.json" > "$RUNNER_TEMP/base-lock.txt" 2>/dev/null; then KIND=npm
            else
              echo "::warning::Prettier ($DIR) : aucun fichier de verrouillage a la base ; saute."
              RESUME="$RESUME Prettier ($DIR) : verrouillage absent, saute."; continue
            fi
            SPECS_RC=0
            node -e '
              const fs = require("fs");
              const [pkgF, lockF, kind] = process.argv.slice(1);
              const p = JSON.parse(fs.readFileSync(pkgF, "utf8"));
              const d = Object.assign({}, p.dependencies, p.devDependencies);
              if (!d.prettier) process.exit(0);
              const lock = fs.readFileSync(lockF, "utf8");
              const clean = v => { const m = /^(\d+\.\d+\.\d+(?:-[0-9A-Za-z.]+)?)(?:\(.*)?$/.exec(String(v || "").trim()); return m ? m[1] : null; };
              let get;
              if (kind === "npm") {
                const pk = JSON.parse(lock).packages || {};
                get = n => clean((pk["node_modules/" + n] || {}).version);
              } else {
                const L = lock.split("\n");
                let from = 0, to = L.length;
                const imp = L.findIndex(l => /^importers:\s*$/.test(l));
                if (imp >= 0) {
                  const k = L.findIndex((l, i) => i > imp && /^  \.:\s*$/.test(l));
                  if (k < 0) process.exit(3);
                  from = k + 1;
                  const e = L.findIndex((l, i) => i >= from && /^(  \S|\S)/.test(l));
                  to = e < 0 ? L.length : e;
                } else {
                  const e = L.findIndex(l => /^(packages|snapshots):/.test(l));
                  to = e < 0 ? L.length : e;
                }
                get = n => {
                  const re = new RegExp("^\\s+" + n + ":\\s*$");
                  for (let i = from; i < to; i++) {
                    if (!re.test(L[i])) continue;
                    for (let j = i + 1; j < Math.min(i + 4, to); j++) { const m = /^\s+version:\s*(\S+)\s*$/.exec(L[j]); if (m) return clean(m[1]); }
                    return null;
                  }
                  return null;
                };
              }
              const out = [];
              const pv = get("prettier");
              if (!pv) process.exit(3);
              out.push("prettier@" + pv);
              let tw = false;
              for (const n of Object.keys(d)) {
                if (!/^prettier-plugin-[a-z0-9-]+$/.test(n)) continue;
                const v = get(n);
                if (!v) process.exit(3);
                out.push(n + "@" + v);
                if (n === "prettier-plugin-tailwindcss") tw = true;
              }
              if (tw) { const v = get("tailwindcss"); if (!v) process.exit(3); out.push("tailwindcss@" + v); }
              console.log(out.join("\n"));
            ' "$RUNNER_TEMP/base-pkg.json" "$RUNNER_TEMP/base-lock.txt" "$KIND" > "$RUNNER_TEMP/prettier-specs.txt" 2>/dev/null || SPECS_RC=$?
            if [ "$SPECS_RC" -ne 0 ]; then
              echo "::warning::Prettier ($DIR) : version introuvable dans le verrouillage de la base ; saute."
              RESUME="$RESUME Prettier ($DIR) : version introuvable dans le verrouillage, saute."; continue
            fi
            [ -s "$RUNNER_TEMP/prettier-specs.txt" ] || continue
            ENVDIR="$(mktemp -d "$RUNNER_TEMP/prettier-env.XXXXXX")"
            printf '{"private":true}\n' > "$ENVDIR/package.json"
            if ! ( cd "$ENVDIR" && xargs -d '\n' npm install --ignore-scripts --no-audit --no-fund --no-package-lock --save-exact < "$RUNNER_TEMP/prettier-specs.txt" ) > "$RUNNER_TEMP/prettier-npm.log" 2>&1; then
              echo "::warning::Prettier : installation impossible (version ou plugin de la base) ; fichiers laisses tels quels."
              RESUME="$RESUME Prettier ($DIR) : installation impossible, saute."; continue
            fi
            # Configuration de la BASE, copiee dans le dossier d'installation (jamais lue depuis le correctif).
            CFG=""; UNSUP=0; CRC=0
            node -e '
              const fs = require("fs");
              const p = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              if (!("prettier" in p)) process.exit(4);
              if (p.prettier === null || typeof p.prettier !== "object" || Array.isArray(p.prettier)) process.exit(5);
              fs.writeFileSync(process.argv[2], JSON.stringify(p.prettier) + "\n");
            ' "$RUNNER_TEMP/base-pkg.json" "$ENVDIR/prettier-base.json" 2>/dev/null || CRC=$?
            if [ "$CRC" -eq 0 ]; then
              CFG="$ENVDIR/prettier-base.json"
            elif [ "$CRC" -eq 4 ]; then
              for C in .prettierrc .prettierrc.json .prettierrc.yaml .prettierrc.yml .prettierrc.json5 .prettierrc.js .prettierrc.ts .prettierrc.mjs .prettierrc.mts .prettierrc.cjs .prettierrc.cts prettier.config.js prettier.config.ts prettier.config.mjs prettier.config.mts prettier.config.cjs prettier.config.cts .prettierrc.toml; do
                git cat-file -e "HEAD:${PFX}$C" 2>/dev/null || continue
                case "$C" in
                  *.ts|*.mts|*.cts|*.toml) UNSUP=1; break ;;
                  .prettierrc|*.json|*.yaml|*.yml|*.json5) DEST="$C" ;;
                  *.mjs) DEST="prettier-base.mjs" ;;
                  *.cjs) DEST="prettier-base.cjs" ;;
                  *) if git show "HEAD:${PFX}$C" | grep -Eq '^[[:space:]]*(export|import)[[:space:]]'; then DEST="prettier-base.mjs"; else DEST="prettier-base.cjs"; fi ;;
                esac
                git show "HEAD:${PFX}$C" > "$ENVDIR/$DEST" && CFG="$ENVDIR/$DEST"
                break
              done
              if [ "$UNSUP" -eq 0 ] && [ -z "$CFG" ]; then printf '{}\n' > "$ENVDIR/prettier-base.json"; CFG="$ENVDIR/prettier-base.json"; fi
            else
              UNSUP=1
            fi
            if [ "$UNSUP" -ne 0 ] || [ -z "$CFG" ]; then
              echo "::warning::Prettier ($DIR) : configuration de la base non prise en charge ; saute."
              RESUME="$RESUME Prettier ($DIR) : configuration non prise en charge, saute."; continue
            fi
            # Aucun plugin relatif ni feuille Tailwind locale : seuls les plugins installes depuis le verrouillage de la base.
            if ! node -e '
              const fs = require("fs");
              const [cfg, specs] = process.argv.slice(1);
              const txt = fs.readFileSync(cfg, "utf8");
              if (/["\x27]\.{1,2}\//.test(txt) || /tailwindConfig|tailwindStylesheet/.test(txt)) process.exit(1);
              const inst = fs.readFileSync(specs, "utf8").split("\n").filter(Boolean).map(s => s.replace(/@[^@]*$/, ""));
              let j = null;
              try { j = JSON.parse(txt); } catch (e) { j = null; }
              if (!j) process.exit(0);
              const liste = [j.plugins].concat(Array.isArray(j.overrides) ? j.overrides.map(o => o && o.options && o.options.plugins) : []);
              for (const pl of liste) {
                if (pl === undefined || pl === null) continue;
                if (!Array.isArray(pl)) process.exit(1);
                for (const x of pl) if (typeof x !== "string" || !inst.includes(x)) process.exit(1);
              }
            ' "$CFG" "$RUNNER_TEMP/prettier-specs.txt" 2>/dev/null; then
              echo "::warning::Prettier ($DIR) : plugin ou chemin relatif dans la configuration de la base ; saute."
              RESUME="$RESUME Prettier ($DIR) : configuration refusee (plugin relatif), saute."; continue
            fi
            # Plugins : noms nus -> chemins ABSOLUS resolus dans $ENVDIR (jamais dans le correctif). Ce script ne lit que la configuration
            # de la base et $ENVDIR ; tout chemin hors de $ENVDIR/node_modules/ fait echouer (formatage saute).
            if ! ( cd "$ENVDIR" && node -e '
              const fs = require("fs");
              const path = require("path");
              const { createRequire } = require("module");
              const [cfg, env] = process.argv.slice(1);
              const racine = path.resolve(env, "node_modules") + path.sep;
              const rq = createRequire(path.join(env, "package.json"));
              let j = null;
              try { j = JSON.parse(fs.readFileSync(cfg, "utf8")); } catch (e) { j = null; }
              if (!j) process.exit(0);
              const abs = n => { const p = path.resolve(rq.resolve(n)); if (!p.startsWith(racine)) process.exit(1); return p; };
              if (Array.isArray(j.plugins)) j.plugins = j.plugins.map(abs);
              if (Array.isArray(j.overrides)) for (const o of j.overrides) if (o && o.options && Array.isArray(o.options.plugins)) o.options.plugins = o.options.plugins.map(abs);
              fs.writeFileSync(cfg, JSON.stringify(j) + "\n");
            ' "$CFG" "$ENVDIR" ) 2>/dev/null; then
              echo "::warning::Prettier ($DIR) : plugin introuvable dans le dossier d'installation ; saute."
              RESUME="$RESUME Prettier ($DIR) : plugin non resolu, saute."; continue
            fi
            # .prettierignore : contenu de la BASE (les motifs sont relatifs a l'emplacement du fichier, donc remis a sa place ; le
            # fichier est interdit dans le correctif), sinon /dev/null.
            IGN=/dev/null
            if git cat-file -e "HEAD:${PFX}.prettierignore" 2>/dev/null && git show "HEAD:${PFX}.prettierignore" > "${PFX}.prettierignore"; then IGN="${PFX}.prettierignore"; fi
            # Prettier lance depuis $ENVDIR (repertoire courant hors du correctif), fichiers en chemins absolus.
            [ "$IGN" = /dev/null ] || IGN="$GITHUB_WORKSPACE/$IGN"
            awk -v w="$GITHUB_WORKSPACE" '{ print w "/" $0 }' "$RUNNER_TEMP/prettier-fichiers.txt" > "$RUNNER_TEMP/prettier-absolus.txt"
            if ( cd "$ENVDIR" && xargs -d '\n' "$ENVDIR/node_modules/.bin/prettier" --config "$CFG" --no-editorconfig --ignore-path "$IGN" --write --ignore-unknown -- < "$RUNNER_TEMP/prettier-absolus.txt" ) > "$RUNNER_TEMP/prettier-sortie.log" 2>&1; then
              NB_PRET=$((NB_PRET + $(wc -l < "$RUNNER_TEMP/prettier-fichiers.txt")))
              RESUME="$RESUME Prettier ($DIR) passe sur $(wc -l < "$RUNNER_TEMP/prettier-fichiers.txt") fichier(s)."
            else
              echo "::warning::Prettier a echoue (sortie non affichee : depot public) ; fichiers laisses tels quels."
              RESUME="$RESUME Prettier ($DIR) : ECHEC, fichiers laisses tels quels (verifier le style avec la CI de la PR)."
            fi
          done
          [ "$NB_PRET" -gt 0 ] || RESUME="$RESUME Prettier non execute (absent de la base, echec ou rien a formater)."
          # Recalcul du correctif a partir de l'arbre mis en forme (memes options que l'etape du coder).
          if [ -s "$RUNNER_TEMP/forme-texte.txt" ]; then
            xargs -d '\n' git -c core.fsmonitor=false -c core.hooksPath=/dev/null add -- < "$RUNNER_TEMP/forme-texte.txt"
          fi
          # RESTE.md (travail partiel) ne doit jamais figurer dans le correctif valide.
          if ! git cat-file -e HEAD:RESTE.md 2>/dev/null; then git rm --cached -q --ignore-unmatch -- RESTE.md; fi
          git -c core.fsmonitor=false -c core.hooksPath=/dev/null diff --cached --binary --full-index --no-renames HEAD > "$PATCH.nouveau"
          [ -s "$PATCH.nouveau" ] || { echo "::error::Correctif vide apres mise en forme."; exit 1; }
          mv "$PATCH.nouveau" "$PATCH"
          if [ -f "$RUNNER_TEMP/essai/RESTE-$NOM.md" ]; then
            RESUME="$RESUME RESTE-$NOM.md est dans l'artefact du codeur (travail partiel a lire) ; il n'est pas dans le correctif."
          fi
          echo "$RESUME"
          { echo "## Mise en forme"; echo; echo "$RESUME"; echo; } >> "$GITHUB_STEP_SUMMARY"

      - name: Resume pour le pilote et artefact du correctif valide
        env:
          BASE: ${{ inputs.base }}
          BASE_SHA: ${{ needs.coder.outputs.base_sha }}
          FOURNISSEUR: ${{ inputs.fournisseur }}
          NOM: ${{ inputs.nom }}
        run: |
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/essai/essai-" + process.env.NOM + ".json", "utf8"));
            const s = Array.isArray(j) ? (j.find(x => x.type === "result") || {}) : j;
            const u = s.usage || {};
            const sur = x => /^[A-Za-z0-9._:\/\[\]-]{1,40}$/.test(x) && !/^sk-/i.test(x);
            const nb = v => Number.isFinite(Number(v)) ? String(Number(v)) : "?";
            // Depot public : la fiche n est PAS recopiee ici (le pilote la connait).
            const corps = [
              "Essai automatique d un modele de code tiers. **Ne pas fusionner sans relecture Opus.**",
              "",
              "- Fournisseur : " + process.env.FOURNISSEUR,
              "- Modele verifie (modelUsage) : " + Object.keys(s.modelUsage || {}).filter(sur).join(", "),
              "- Jetons entree : " + nb(u.input_tokens) + " ; sortie : " + nb(u.output_tokens) +
                " ; cache ecrit : " + nb(u.cache_creation_input_tokens) + " ; cache lu : " + nb(u.cache_read_input_tokens),
              "- Cout indique par la sortie JSON : " + nb(s.total_cost_usd) + " USD (estimation, verifier la console du fournisseur)",
              "- Duree : " + (nb(s.duration_ms) !== "?" ? Math.round(Number(s.duration_ms) / 1000) + " s" : "?") + " (" + nb(s.num_turns) + " tours)",
              "",
              "Correctif valide : artefact correctif-valide-" + process.env.FOURNISSEUR + "-" + process.env.NOM + " du run " + process.env.GITHUB_SERVER_URL + "/" + process.env.GITHUB_REPOSITORY + "/actions/runs/" + process.env.GITHUB_RUN_ID
            ].join("\n");
            fs.writeFileSync(process.env.RUNNER_TEMP + "/corps-pr.md", corps);
          '
          {
            echo "## Correctif valide : branche a creer par le pilote"
            echo
            echo "Branche : essai/$FOURNISSEUR/$NOM"
            echo "Base : ${BASE:-branche par defaut} @ $BASE_SHA (appliquer sur CE commit, git apply --3way ; refuser si la tete de la PR a change)"
            echo "Titre de PR : [essai $FOURNISSEUR] $NOM"
            echo "Artefact : correctif-valide-$FOURNISSEUR-$NOM (patch + JSON)"
            echo
            echo "Corps de PR :"
            echo
            echo '~~~markdown'
            cat "$RUNNER_TEMP/corps-pr.md"
            echo
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Envoyer le correctif valide
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: correctif-valide-${{ inputs.fournisseur }}-${{ inputs.nom }}
          path: |
            ${{ runner.temp }}/essai/essai-${{ inputs.nom }}.json
            ${{ runner.temp }}/essai/essai-${{ inputs.nom }}.patch
          if-no-files-found: error
          retention-days: 7
